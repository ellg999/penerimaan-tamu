<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penerimaan Tamu Terpadu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header class="main-header">
        <h1>Penerimaan Tamu Terpadu</h1>
        <p class="soft-text">Portal Digital Jadwal Kunjungan Sekolah</p>
        
        <!-- Fitur Switch Toggle -->
        <div class="toggle-wrapper">
            <span class="toggle-label soft-text" id="labelTamu">Portal Tamu</span>
            <label class="switch">
                <input type="checkbox" id="viewToggle">
                <span class="slider round"></span>
            </label>
            <span class="toggle-label soft-text" id="labelDashboard">Dashboard</span>
        </div>
    </header>

    <!-- PORTAL TAMU VIEW -->
    <div id="guestView" class="view-section container">
        <div class="card">
            <h2>Form Pengajuan Kunjungan</h2>
            <form id="guestForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="guestName" required>
                </div>
                <div class="form-group">
                    <label>Kategori Tamu</label>
                    <select id="guestCategory" required>
                        <option value="">Pilih Kategori...</option>
                        <option value="Kolega">Kolega</option>
                        <option value="Orang Tua">Orang Tua</option>
                        <option value="Siswa">Siswa</option>
                    </select>
                </div>
                <div class="form-group hidden" id="nisnGroup">
                    <label>NISN (Wajib untuk Siswa)</label>
                    <input type="text" id="guestNISN">
                </div>
                <div class="form-group">
                    <label>Pihak yang Dituju (Host)</label>
                    <select id="hostName" required>
                        <option value="Bpk. Budi (Kepsek)">Bpk. Budi (Kepsek)</option>
                        <option value="Ibu Ani (Guru Matematika)">Ibu Ani (Guru Matematika)</option>
                        <option value="Pak Joko (Tata Usaha)">Pak Joko (Tata Usaha)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Waktu Kunjungan</label>
                    <input type="datetime-local" id="visitTime" required>
                </div>
                <button type="submit" class="btn-primary">Ajukan Jadwal</button>
            </form>
        </div>

        <div class="card">
            <h2>Cek Status & QR Code</h2>
            <p class="soft-text-dark">Masukkan nama Anda untuk melihat status persetujuan.</p>
            <div class="form-group">
                <input type="text" id="checkName" placeholder="Nama Lengkap Anda">
                <button onclick="checkStatus()" class="btn-secondary">Cek Status</button>
            </div>
            <div id="statusResult" class="status-box hidden"></div>
            <div id="qrcode" class="qr-container"></div>
        </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="view-section container-dashboard hidden">
        <div class="card">
            <h2>Manajemen Antrean & Kunjungan</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Tamu</th>
                            <th>Kategori</th>
                            <th>Host Tujuan</th>
                            <th>Waktu</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable">
                        <!-- Render dari JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
