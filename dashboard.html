<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Staf & Resepsionis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-dashboard">
        <header>
            <h1>Dashboard Manajemen Tamu</h1>
            <nav>
                <a href="index.html">Portal Tamu</a> | 
                <a href="dashboard.html">Dashboard Staf</a>
            </nav>
        </header>

        <div class="card">
            <h2>Daftar Kunjungan Terjadwal</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Tamu</th>
                            <th>Kategori</th>
                            <th>Host Tujuan</th>
                            <th>Waktu</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable">
                        <!-- Data diisi oleh JS -->
                    </tbody>
                </table>
            </div>
            <button class="btn-danger" onclick="clearData()">Reset Semua Data (Demo)</button>
        </div>
    </div>
    <script src="js/dashboard.js"></script>
</body>
</html>
